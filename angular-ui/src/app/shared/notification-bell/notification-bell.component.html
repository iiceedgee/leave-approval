<div class="notification-wrapper" (click)="toggleNotifications($event)">
  <i class="fa-solid fa-bell"></i>
  <span class="notification-badge" *ngIf="unreadCount">{{ unreadCount }}</span>

  <div class="notification-card" *ngIf="showNotifications" (click)="$event.stopPropagation()">
    <div class="notification-header">การแจ้งเตือน</div>
    <div class="notification-list">
      <div class="notification-item" *ngFor="let n of notifications" (click)="onClick(n, $event)">
        <span class="badge-floating" *ngIf="!n.isRead"></span>
        <div class="detail">
          <div>ประเภท: {{ n.type }}</div>
          <div>วันที่: {{ n.date }}</div>
          <div>สถานะ: <span [class]="n.statusClass">{{ n.statusLabel }}</span></div>
        </div>
      </div>
      <div class="notification-item" *ngIf="notifications.length === 0">
        <div class="detail">ไม่มีการแจ้งเตือน</div>
      </div>
    </div>
  </div>
</div>

<div class="login-container">
  <div class="login-card">
    <h1>Leave Approval</h1>
    <p class="subtitle">ระบบขออนุญาตลา</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="emp01 / mgr01 / hr01" (keydown.enter)="login()" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="123456" (keydown.enter)="login()" />
    </div>
    <button class="btn btn-primary" style="width:100%;padding:12px;font-size:16px;" (click)="login()">เข้าสู่ระบบ</button>
    <div class="error-msg" *ngIf="error">{{ error }}</div>
    <div class="hint">
      <p>ทดสอบ: emp01 / mgr01 / hr01</p>
      <p>password: 123456</p>
    </div>
  </div>
</div>

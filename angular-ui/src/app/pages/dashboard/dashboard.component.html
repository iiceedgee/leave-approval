<div class="page-container">
  <div class="header">
    <h2>{{ title }}</h2>
    <div class="header-right">
      <app-notification-bell></app-notification-bell>
      <span class="badge">{{ user?.fullName }} ({{ roleLabels[user?.role || ''] || '' }})</span>
      <button class="btn-sm-logout" (click)="logout()">ออกจากระบบ</button>
    </div>
  </div>

  <div class="emp-actions" *ngIf="user?.role === 'emp'">
    <button class="btn btn-primary" [routerLink]="'/leave/new'"><i class="fa-regular fa-plus"></i> ยื่นคำขอลา</button>
    <button class="btn btn-outline" [routerLink]="'/my-leaves/history'">
      <i class="fa-regular fa-calendar"></i> ประวัติการลา
    </button>
  </div>

  <div class="loading" *ngIf="loading">กำลังโหลด...</div>

  <dx-data-grid *ngIf="!loading" [dataSource]="leaves" [showBorders]="true" [columnAutoWidth]="true"
    [rowAlternationEnabled]="true" [hoverStateEnabled]="true" noDataText="ไม่มีรายการ"
    (onOptionChanged)="onGridOptionChanged($event)">
    <dxo-paging [pageSize]="limit" [pageIndex]="page - 1"></dxo-paging>
    <dxo-editing [allowAdding]="false" [allowDeleting]="false" [allowUpdating]="false"></dxo-editing>
    <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]" [showInfo]="true"
      [showNavigationButtons]="true" [visible]="true" infoText="หน้า {0} จาก {1} ({2} รายการ)"></dxo-pager>
    <dxo-sorting mode="single"></dxo-sorting>
    <dxo-search-panel [visible]="true" [width]="240" placeholder="ค้นหา..."></dxo-search-panel>

    <dxi-column [width]="80" caption="ลำดับ" alignment="center" cellTemplate="rowNumTemplate">
      <div *dxTemplate="let cell of 'rowNumTemplate'">
        {{ cell.component.pageIndex() * cell.component.pageSize() + cell.rowIndex + 1 }}
      </div>
    </dxi-column>

    <dxi-column dataField="user_id" caption="ผู้ยื่น" [visible]="user?.role !== 'emp'" cellTemplate="userNameTemplate" alignment="center">
      <div *dxTemplate="let data of 'userNameTemplate'">
        {{ data.data.owner_name }}
      </div>
    </dxi-column>

    <dxi-column dataField="leave_type" caption="ประเภท" alignment="center"></dxi-column>

    <dxi-column caption="วันที่" cellTemplate="dateTemplate" alignment="center">
      <div *dxTemplate="let data of 'dateTemplate'">
        {{ data.data.start_date }} ~ {{ data.data.end_date }}
      </div>
    </dxi-column>

    <dxi-column dataField="current_status" caption="สถานะ" cellTemplate="statusTemplate" alignment="center">
      <div *dxTemplate="let data of 'statusTemplate'">
        <app-status-badge [statusCode]="data.data.current_status"></app-status-badge>
        <span *ngIf="data.data.flag_send_back === 'Y'" class="sendback-badge" role="status" aria-label="ถูกส่งกลับ กรุณาแก้ไขแล้วส่งใหม่" title="ถูกส่งกลับ กรุณาแก้ไขแล้วส่งใหม่"><span aria-hidden="true">🔄</span> ส่งกลับแก้ไข</span>
      </div>
    </dxi-column>

    <dxi-column caption="Actions" cellTemplate="actionsTemplate" alignment="center">
      <div *dxTemplate="let data of 'actionsTemplate'">
        <div class="actions-cell">
          <a class="btn-sm" [routerLink]="'/leave/' + data.data.id">ดูรายละเอียด</a>
          <a *ngIf="data.data.flag_send_back === 'Y' && ''+data.data.user_id === ''+user?.id" class="btn-sm btn-resubmit" [routerLink]="'/leave/' + data.data.id + '/edit'" [attr.aria-label]="'แก้ไขคำขอ ' + (data.data.request_no || data.data.id)">แก้ไข</a>
        </div>
      </div>
    </dxi-column>
  </dx-data-grid>
</div>
